name: Update profile README

on:
  schedule:
    # Daily at 04:17 UTC (a slightly off-the-hour minute to avoid GHA scheduler congestion)
    - cron: "17 4 * * *"
  workflow_dispatch:        # lets you trigger manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/update_readme.py"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write           # needed for the bot to commit README.md back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh README block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit & push if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh latest-repos block"
          git push
